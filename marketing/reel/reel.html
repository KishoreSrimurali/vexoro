const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (b, s, e) => clamp((b - s) / (e - s));
const outExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const inExpo = x => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const outBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

// Deterministic grain tiles (so every render is identical)
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const GRAIN = [];
for (let k = 0; k < 4; k++) {
  const g = document.createElement("canvas"); g.width = W; g.height = H;
  const gc = g.getContext("2d"); const img = gc.createImageData(W, H); const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = rnd();
    if (r > 0.955) { d[i] = d[i+1] = d[i+2] = 255; d[i+3] = 150; }
    else if (r < 0.06) { d[i] = d[i+1] = d[i+2] = 0; d[i+3] = 200; }
  }
  gc.putImageData(img, 0, 0); GRAIN.push(g);
}

function font(size, weight = 800, stretch = "expanded") {
  ctx.font = `${weight} ${size}px Archivo, "Arial Black", sans-serif`;
  ctx.fontStretch = stretch;
  ctx.letterSpacing = `${-size * 0.03}px`;
}
// size that fits `text` inside maxW, capped at maxSize
function fit(text, maxW, maxSize, weight = 800) {
  font(100, weight); const w = ctx.measureText(text).width;
  return Math.min(maxSize, (maxW / w) * 100);
}
// Draws a word with the brand's violet square as its full stop. cy = visual centre.
function word(text, cx, cy, size, { color = C.ink, square = true, alpha = 1, weight = 800, align = "center", stretch = "expanded" } = {}) {
  font(size, weight, stretch);
  const w = ctx.measureText(text).width;
  const sq = square ? { w: size * 0.30, h: size * 0.23, gap: size * 0.06 } : { w: 0, h: 0, gap: 0 };
  const total = w + sq.gap + sq.w;
  const x0 = align === "center" ? cx - total / 2 : cx;
  const base = cy + size * 0.36;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.fillText(text, x0, base);
  if (square) { ctx.fillStyle = C.violet; ctx.fillRect(x0 + w + sq.gap, base - sq.h, sq.w, sq.h); }
  ctx.globalAlpha = 1;
  return total;
}
// Masked slide: content rises into a line box (enter p 0→1), leaves upward (exit q 0→1)
function masked(cy, size, p, q, draw) {
  const boxH = size * 1.25;
  ctx.save();
  // extra room below for descenders (g, p, y)
  ctx.beginPath(); ctx.rect(0, cy - boxH / 2, W, boxH + size * 0.3); ctx.clip();
  // start fully below the clip (including the descender room) so nothing peeks in early
  const dy = (1 - outExpo(p)) * (boxH + size * 0.3) - inExpo(q) * boxH;
  draw(cy + dy);
  ctx.restore();
}
function drawMark(cx, cy, width, color = C.ink) {
  const s = width / 1174;
  ctx.save(); ctx.translate(cx - width / 2, cy - (886 * s) / 2); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.fill(MARK, "evenodd"); ctx.restore();
}
function drawWordmark(x, cy, width, reveal = 1) {
  const s = width / 3000, h = 313 * s;
  ctx.save(); ctx.beginPath(); ctx.rect(x, cy - h, width * reveal, h * 2); ctx.clip();
  ctx.translate(x, cy - h / 2); ctx.scale(s, s);
  ctx.fillStyle = C.ink; ctx.fill(WM_INK, "evenodd");
  ctx.fillStyle = C.violet; ctx.fill(WM_DOT);
  ctx.fillStyle = C.stone; ctx.fill(WM_DEV, "evenodd");
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}

function background(t) {
  ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
  const drift = Math.sin(t * 0.6) * 60;
  let g = ctx.createRadialGradient(-80 + drift, -60, 0, -80 + drift, -60, 1250);
  g.addColorStop(0, "rgba(255,255,255,0.30)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W + 60 - drift, H + 40, 0, W + 60 - drift, H + 40, 1150);
  g.addColorStop(0, "rgba(255,255,255,0.28)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.55; ctx.drawImage(GRAIN[Math.floor(t * 12) % 4], 0, 0); ctx.globalAlpha = 1;
}

// ---------- scenes (b = time in beats) ----------
function render(t) {
  const b = t / B;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  const CY = 900; // optical centre, above the Reels caption area

  // S0 · square pop + streak
  if (b < 2) {
    const pop = outBack(seg(b, 0, 0.35)) * (1 - inExpo(seg(b, 1.6, 2)));
    const blink = b > 0.55 && b < 0.68 ? 0 : 1;
    const w = 150 * pop, h = 112 * pop;
    ctx.fillStyle = C.violet; ctx.globalAlpha = blink;
    ctx.fillRect(540 - w / 2, CY - h / 2, w, h); ctx.globalAlpha = 1;
    const a = outExpo(seg(b, 1, 1.35)), r = inExpo(seg(b, 1.35, 1.9));
    if (a > 0 && r < 1) {
      ctx.save(); ctx.translate(540, CY); ctx.rotate(-Math.PI / 3.3);
      ctx.fillStyle = C.ink; const L = 2600;
      ctx.fillRect(-L / 2 + L * r, -4, L * (a - r), 8); ctx.restore();
    }
  }

  // S1 · mark drawn on with a diagonal wipe, hit, zoom through
  else if (b < 6) {
    const p = outExpo(seg(b, 2, 3.1));
    const hit = 1 - outExpo(seg(b, 4, 4.5));
    const zoom = inExpo(seg(b, 5.4, 6));
    const width = 700 * (1 + 0.05 * hit) * (1 + zoom * 4);
    ctx.save();
    ctx.translate(540, CY); ctx.rotate(-0.58);
    ctx.beginPath(); ctx.rect(-1400, -1400, 2800 * p, 2800); ctx.clip();
    ctx.rotate(0.58); ctx.translate(-540, -CY);
    ctx.globalAlpha = 1 - zoom;
    if (hit > 0.4) drawMark(540 + 16 * hit, CY - 6 * hit, width, C.violet);
    drawMark(540, CY, width);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // S2 · design. code. search. → one studio
  else if (b < 10) {
    const words = ["design", "code", "search"];
    if (b < 9) {
      words.forEach((wd, i) => {
        const s = 6 + i;
        if (b >= s && b < s + 1.2) {
          const size = fit(wd + " ", 900, 260);
          masked(CY, size, seg(b, s, s + 0.32), seg(b, s + 0.9, s + 1.15), y => word(wd, 540, y, size));
        }
      });
    } else {
      words.forEach((wd, i) => {
        const p = seg(b, 9 + i * 0.08, 9.35 + i * 0.08);
        masked(CY - 230 + i * 150, 120, p, seg(b, 9.85, 10), y => word(wd, 540, y, 120, { square: false }));
      });
      masked(CY + 260, 84, seg(b, 9.4, 9.7), seg(b, 9.85, 10), y => word("one studio", 540, y, 84, { color: C.stone }));
    }
  }

  // S3 · giant "websites" sweep → for brands
  else if (b < 14) {
    if (b < 12.4) {
      const size = 520; font(size);
      const w = ctx.measureText("websites").width;
      // starts with the first letters already on screen, so there is no empty beat
      const x0 = 560, x = x0 - (w + x0 - 60) * (0.15 * seg(b, 10, 12.4) + 0.85 * inOut(seg(b, 10, 12.4)));
      ctx.fillStyle = C.ink; ctx.textAlign = "left"; ctx.fillText("websites", x, CY + size * 0.36);
    } else {
      masked(CY - 110, 150, seg(b, 12.4, 12.7), seg(b, 13.8, 14), y => word("websites", 540, y, 150, { square: false }));
      masked(CY + 70, 150, seg(b, 12.55, 12.85), seg(b, 13.8, 14), y => word("for brands", 540, y, fit("for brands  ", 940, 150)));
    }
  }

  // S4 · services, one every half beat
  else if (b < 18) {
    const items = ["brand sites", "landing pages", "online stores", "web apps", "seo audits", "care plans"];
    masked(CY - 210, 64, seg(b, 14, 14.3), seg(b, 17.75, 18), y => word("we make", 540, y, 64, { color: C.stone, square: false, weight: 600 }));
    const i = Math.min(items.length - 1, Math.floor((b - 14.25) / 0.5));
    if (b >= 14.25) {
      const s = 14.25 + i * 0.5, size = fit(items[i] + "  ", 940, 150);
      const last = i === items.length - 1;
      masked(CY, size, seg(b, s, s + 0.2), last ? seg(b, 17.75, 18) : seg(b, s + 0.38, s + 0.5), y => word(items[i], 540, y, size, { square: false }));
    }
    // progress rule
    const pr = seg(b, 14.25, 17.25);
    ctx.fillStyle = "rgba(255,255,255,0.16)"; ctx.fillRect(170, CY + 170, 740, 4);
    ctx.fillStyle = C.violet; ctx.fillRect(170, CY + 170, 740 * outExpo(pr) * (1 - inExpo(seg(b, 17.75, 18))), 4);
  }

  // S5 · six week blocks
  else if (b < 22) {
    const out = seg(b, 21.75, 22);
    masked(CY - 200, 230, seg(b, 18, 18.3), out, y => word("6 weeks", 540, y, fit("6 weeks  ", 920, 230)));
    masked(CY + 20, 76, seg(b, 18.15, 18.45), out, y => word("to launch", 540, y, 76, { color: C.stone, square: false, weight: 600 }));
    const bw = (940 - 5 * 16) / 6;
    for (let k = 0; k < 6; k++) {
      const appear = outExpo(seg(b, 18.2 + k * 0.05, 18.5 + k * 0.05)) * (1 - inExpo(out));
      const lit = b >= 18.9 + k * 0.4;
      ctx.globalAlpha = appear;
      ctx.fillStyle = lit ? C.violet : "rgba(255,255,255,0.18)";
      const pulse = lit ? 1 + 0.25 * (1 - outExpo(seg(b, 18.9 + k * 0.4, 19.2 + k * 0.4))) : 1;
      roundRect(70 + k * (bw + 16), CY + 210 - 18 * (pulse - 1) * 2, bw, 40 * pulse, 10);
      ctx.globalAlpha = 1;
    }
  }

  // S6 · you own everything → square swells to fill the frame
  else if (b < 26) {
    const shrink = inExpo(seg(b, 24.6, 25.3));
    ctx.save(); ctx.translate(540, CY); ctx.scale(1 - shrink, 1 - shrink); ctx.translate(-540, -CY);
    masked(CY - 110, 190, seg(b, 22, 22.3), 0, y => word("you own", 540, y, 190, { square: false }));
    masked(CY + 90, 170, seg(b, 23, 23.3), 0, y => word("everything", 540, y, fit("everything  ", 960, 170)));
    ctx.restore();
    const grow = inExpo(seg(b, 25, 26));
    if (grow > 0) {
      const w = 60 + grow * 2600, h = w * 0.75;
      ctx.fillStyle = C.violet; ctx.fillRect(540 - w / 2, CY - h / 2, w, h);
    }
  }

  // S7 · logo hit
  else {
    const drop = outExpo(seg(b, 26, 26.5));
    drawMark(540, CY - 140 - 40 * (1 - drop), 560 * (1.35 - 0.35 * drop));
    drawWordmark(540 - 420, CY + 320, 840, outExpo(seg(b, 26.6, 27.4)));
    masked(CY + 460, 58, seg(b, 28, 28.35), 0, y => word("websites for brands", 540, y, 58, { color: C.stone, square: false, weight: 600, stretch: "normal" }));
    const flash = 1 - outExpo(seg(b, 26, 26.45));
    if (flash > 0) { ctx.fillStyle = `rgba(110,85,255,${0.9 * flash})`; ctx.fillRect(0, 0, W, H); }
  }
}
window.render = render;
window.ready = document.fonts.load('800 100px Archivo').then(() => document.fonts.ready).then(() => true);
</script>
